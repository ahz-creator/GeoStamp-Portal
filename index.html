<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061629">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GeoStamp Public Evidence Verification</title>
  <link rel="stylesheet" href="styles.css?v=20260807-qr4">
</head>
<body>
  <header class="topbar">
    <div class="brandBlock">
      <div class="brandMark">G</div>
      <div>
        <div class="brandName">GEOSTAMP</div>
        <div class="brandSub">Public Evidence Verification · Axiom InfraTech</div>
      </div>
    </div>
    <div class="topStatus">SECURE · TRANSPARENT · AUDITABLE</div>
  </header>

  <main class="page">
    <section class="verifyPanel">
      <div>
        <div class="eyebrow">PUBLIC REGISTRY</div>
        <h1>Verify Evidence</h1>
        <p class="lead">Enter the complete Evidence ID or select a received GeoStamp photo.</p>
      </div>

      <div class="verifyControls">
        <input id="idInput" autocomplete="off" placeholder="GST-26-XXXX-XXXX-XXXX">
        <button id="lookupButton">VERIFY</button>
      </div>

      <div class="secondaryActions">
        <label class="uploadButton">
          SELECT RECEIVED PHOTO
          <input id="photoInput" type="file" accept="image/*">
        </label>
        <span id="statusMessage">Ready to verify · QR Certificate v4</span>
      </div>
    </section>
  </main>

  <script>
    const REGISTRY_ENDPOINT = "https://script.google.com/macros/s/AKfycbxcANK_eHZ3aAqYYCvhYOxcdMuSNTBJ6CFvX-yRt6V2RtPbgRu9lvGYSmRHak3sumXs/exec";
    const $ = id => document.getElementById(id);

    function openCertificate(evidenceId) {
      const clean = String(evidenceId || "").trim().toUpperCase();
      if (!clean) {
        $("statusMessage").textContent = "Enter an Evidence ID.";
        return;
      }
      if (!/^GST-[A-Z0-9-]{8,64}$/.test(clean)) {
        $("statusMessage").textContent = "Enter a valid GeoStamp Evidence ID.";
        return;
      }
      $("statusMessage").textContent = "Opening registry certificate…";
      const url = `${REGISTRY_ENDPOINT}?view=certificate&id=${encodeURIComponent(clean)}&v=${Date.now()}`;
      window.location.replace(url);
    }

    async function decodeQrFromPhoto(file) {
      if (!("BarcodeDetector" in window)) {
        throw new Error("This browser cannot read QR codes from images.");
      }
      const bitmap = await createImageBitmap(file);
      const detector = new BarcodeDetector({ formats: ["qr_code"] });
      const codes = await detector.detect(bitmap);
      if (!codes.length) throw new Error("No QR code found in the selected image.");
      const raw = codes[0].rawValue.trim();

      try {
        const url = new URL(raw);
        const directId = url.searchParams.get("id");
        if (directId) return directId;
        const encoded = url.searchParams.get("e");
        if (encoded) {
          let value = encoded.replace(/-/g, "+").replace(/_/g, "/");
          while (value.length % 4) value += "=";
          const decoded = JSON.parse(decodeURIComponent(escape(atob(value))));
          return decoded.evidenceId || decoded.verificationId || decoded.id;
        }
      } catch (_) {}

      if (/^GST-[A-Z0-9-]+$/i.test(raw)) return raw;
      throw new Error("The selected QR does not contain a supported GeoStamp Evidence ID.");
    }

    $("lookupButton").addEventListener("click", () => openCertificate($("idInput").value));
    $("idInput").addEventListener("keydown", event => {
      if (event.key === "Enter") openCertificate(event.target.value);
    });
    $("photoInput").addEventListener("change", async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      $("statusMessage").textContent = "Reading QR from received photo…";
      try {
        const evidenceId = await decodeQrFromPhoto(file);
        $("idInput").value = evidenceId;
        openCertificate(evidenceId);
      } catch (error) {
        $("statusMessage").textContent = error.message || "QR could not be read.";
      }
    });

    const queryId = new URLSearchParams(location.search).get("id");
    if (queryId) {
      $("idInput").value = queryId;
      openCertificate(queryId);
    }
  </script>
</body>
</html>
