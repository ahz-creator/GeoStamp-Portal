<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoStamp Evidence Portal</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>GeoStamp Evidence Portal</h1><p>Digital evidence verification by Axiom InfraTech</p></header><main><section class="card"><h2>Verify Evidence</h2><div class="row"><input id="idInput" placeholder="Verification ID"><button id="lookup">Lookup</button></div><label class="upload">Select received photo<input id="photo" type="file" accept="image/*"></label><p id="scanStatus" class="muted">QR scanning is performed locally in your browser where supported.</p></section><section id="result" class="card hidden"><div class="status" id="overall"></div><img id="thumb" class="thumb hidden"><div id="rows"></div><p class="notice">GeoStamp reports the evidence signals recorded at capture. A registered image may still contain a location warning or risk.</p><button onclick="window.print()">Print result</button></section></main><script src="app.js"></script></body></html>
